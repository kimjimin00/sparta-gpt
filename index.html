<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MintoLog</title>
    <link rel="icon" type="image/png" href="mysql.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://s3.ap-northeast-2.amazonaws.com/materials.spartacodingclub.kr/easygpt/default.css">

    <style>
        * { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #FFFDF2;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar-custom {
            width: 100%;
            height: 72px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFDF2;
            position: relative;
            z-index: 100;
        }

        .logo {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 25px;
            font-weight: 400;
            letter-spacing: -1.5px;
            color: #111;
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 42px;
            margin-left: auto;
            margin-right: 40px;
        }

        .nav-menu a {
            color: #111;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: opacity .25s ease, color .25s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: #506817;
        }

        .learn-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 20px;
            background: #506817;
            color: #fff;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: .25s ease;
        }

        .learn-button:hover {
            background: #3e5111;
            color: #fff;
            transform: translateY(-2px);
        }

        .hero-section {
            width: 100%;
            text-align: center;
            padding: 70px 20px 0;
        }

        .hero-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(58px, 8vw, 105px);
            font-weight: 400;
            letter-spacing: -5px;
            line-height: .95;
        }

        .hero-subtitle {
            margin: 22px 0 0;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #777766;
        }

        .visual-section {
            position: relative;
            width: 100%;
            height: 650px;
            margin-top: 55px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 2;
        }

        .hero-image {
            position: relative;
            z-index: 3;
            display: block;
            width: 67%;
            max-width: 900px;
            height: auto;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 14px 35px rgba(0,0,0,.08);
            transition: transform .15s linear;
        }

        .content-background {
            position: relative;
            z-index: 1;
            background: #fff;
            margin-top: -325px;
            padding-top: 395px;
            padding-bottom: 150px;
        }

        .content-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 55px;
        }

        .content-section {
            scroll-margin-top: 100px;
            margin-bottom: 180px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 45px;
        }

        .section-title {
            flex-shrink: 0;
            margin: 0;
            padding-right: 22px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 38px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .section-line {
            width: 100%;
            height: 1px;
            background: #d8d8d8;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 36px;
            row-gap: 70px;
        }

        .content-card {
            display: block;
            color: #111;
            text-decoration: none;
            min-width: 0;
            opacity: 0;
            transform: translateY(35px);
            transition: opacity .7s ease, transform .7s ease;
            cursor: pointer;
        }

        .content-card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .content-image-wrap {
            width: 100%;
            aspect-ratio: 5 / 6;
            overflow: hidden;
            border-radius: 0;
            background: #eee;
        }

        .content-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .6s ease;
        }

        .content-card:hover .content-image {
            transform: scale(1.035);
        }

        .content-category {
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #8a8a78;
        }

        .content-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 25px;
            font-weight: 400;
            line-height: 1.15;
        }

        .content-description {
            margin: 9px 0 0;
            font-size: 13px;
            line-height: 1.55;
            color: #555;
        }

        .content-date {
            margin-top: 12px;
            font-size: 11px;
            color: #777;
        }

        /* 상세보기 모달 */
        .detail-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(5px);
        }

        .detail-modal.show {
            display: flex;
        }

        .modal-box {
            width: min(760px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: #fff;
            padding: 20px;
            position: relative;
        }

        .modal-box img {
            width: 100%;
            max-height: 60vh;
            object-fit: cover;
        }

        .modal-category {
            margin-top: 20px;
            color: #8a8a78;
            font-size: 11px;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .modal-title {
            margin: 8px 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 36px;
            font-weight: 400;
        }

        .modal-description {
            color: #555;
            line-height: 1.7;
        }

        .modal-date {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            font-size: 22px;
            cursor: pointer;
            z-index: 2;
        }

        @media (max-width: 900px) {
            .navbar-custom { padding: 0 25px; }
            .nav-menu { gap: 22px; margin-right: 20px; }
            .content-wrapper { padding: 0 35px; }
            .content-grid { column-gap: 22px; }
        }

        @media (max-width: 768px) {
            .navbar-custom { height: 65px; padding: 0 20px; }
            .logo { font-size: 22px; }
            .nav-menu { display: none; }

            .hero-section { padding-top: 55px; }
            .hero-title { font-size: 55px; letter-spacing: -3px; }

            .visual-section {
                height: 470px;
                margin-top: 45px;
            }

            .hero-image {
                width: 90%;
                border-radius: 20px;
            }

            .content-background {
                margin-top: -235px;
                padding-top: 285px;
                padding-bottom: 100px;
            }

            .content-wrapper { padding: 0 25px; }
            .content-section { margin-bottom: 110px; }

            .section-heading { margin-bottom: 30px; }
            .section-title {
                font-size: 31px;
                padding-right: 16px;
            }

            .content-grid {
                grid-template-columns: repeat(2, 1fr);
                column-gap: 18px;
                row-gap: 55px;
            }

            .content-title { font-size: 21px; }
            .content-description { font-size: 12px; }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 44px;
                letter-spacing: -2px;
            }

            .hero-image { width: 94%; }

            .visual-section { height: 400px; }

            .content-background {
                margin-top: -200px;
                padding-top: 245px;
            }

            .content-wrapper { padding: 0 20px; }

            .section-title { font-size: 28px; }

            .content-grid {
                grid-template-columns: 1fr;
                row-gap: 65px;
            }
        }
    </style>
</head>

<body style="--scrollbar-width: 15px; --hundred-vh: 732px;">

    <header class="navbar-custom">
        <a href="#" class="logo">MintoLog</a>

        <nav class="nav-menu" id="mainNav"></nav>

        <a href="#vlog" class="learn-button">Learn More →</a>
    </header>

    <main>
        <section class="hero-section">
            <h1 class="hero-title">Browse everything.</h1>
            <p class="hero-subtitle">Min to Log · Daily Vlog &amp; Story</p>
        </section>

        <section class="visual-section">
            <img src="hero.jpg" class="hero-image" id="heroImage" alt="MintoLog main image">
        </section>

        <div class="content-background">
            <div class="content-wrapper" id="contentWrapper"></div>
        </div>
    </main>

    <!-- 카드 상세보기 -->
    <div class="detail-modal" id="detailModal" aria-hidden="true">
        <div class="modal-box">
            <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
            <img id="modalImage" src="" alt="">
            <div class="modal-category" id="modalCategory"></div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <p class="modal-description" id="modalDescription"></p>
            <div class="modal-date" id="modalDate"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
