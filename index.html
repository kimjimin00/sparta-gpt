<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>MintoLog</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="mysql.png">

    <link rel="stylesheet"
        href="https://s3.ap-northeast-2.amazonaws.com/materials.spartacodingclub.kr/easygpt/default.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>


    <style>

        /* ========================================
           기본 설정
        ======================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #FFFDF2;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* ========================================
           상단 메뉴
        ======================================== */

        .navbar-custom {
            width: 100%;
            height: 72px;

            padding: 0 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background-color: #FFFDF2;
        }


        /* 로고 */

        .logo {
            font-family: Georgia, "Times New Roman", serif;

            font-size: 26px;
            font-weight: 400;

            letter-spacing: -1.5px;

            color: #111111;

            text-decoration: none;
        }


        /* 메뉴 */

        .nav-menu {
            display: flex;
            align-items: center;

            gap: 42px;

            margin-left: auto;
            margin-right: 40px;
        }

        .nav-menu a {
            color: #111111;

            text-decoration: none;

            font-size: 12px;
            font-weight: 600;

            transition: opacity 0.25s ease;
        }

        .nav-menu a:hover {
            opacity: 0.45;
        }


        /* Learn More 버튼 */

        .learn-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 11px 20px;

            background-color: #506817;
            color: #ffffff;

            border-radius: 30px;

            font-size: 12px;
            font-weight: 600;

            text-decoration: none;

            transition:
                background-color 0.25s ease,
                transform 0.25s ease;
        }

        .learn-button:hover {
            background-color: #3e5111;
            color: #ffffff;

            transform: translateY(-2px);
        }


        /* ========================================
           Hero 영역
        ======================================== */

        .hero-section {
            width: 100%;

            text-align: center;

            padding-top: 75px;
            padding-left: 20px;
            padding-right: 20px;
        }


        /* 메인 타이틀 */

        .hero-title {
            margin: 0;

            font-family: Georgia, "Times New Roman", serif;

            font-size: clamp(58px, 8vw, 105px);

            font-weight: 400;

            letter-spacing: -5px;

            line-height: 0.95;

            color: #111111;
        }


        /* 타이틀 아래 작은 글씨 */

        .hero-subtitle {
            margin-top: 22px;
            margin-bottom: 0;

            font-size: 13px;

            font-weight: 400;

            letter-spacing: 2px;

            color: #656552;
        }


        /* ========================================
           메인 이미지 영역
        ======================================== */

        .visual-section {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-top: 58px;

            padding: 0 20px 100px;
        }


        /* 실제 이미지
           화면 전체의 약 2/3 크기 */

        .hero-image {
            display: block;

            width: 67%;
            max-width: 900px;

            height: auto;

            border-radius: 28px;

            object-fit: cover;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }


        /* 이미지에 마우스를 올렸을 때 */

        .hero-image:hover {
            transform: translateY(-5px);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.12);
        }


        /* ========================================
           아래 레이어
        ======================================== */

        .layer-section {
            width: 100%;

            padding: 80px 40px 120px;

            background-color: #FFFDF2;
        }


        .layer-container {
            max-width: 1100px;

            margin: 0 auto;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;
        }


        .layer-item {
            padding: 28px;

            min-height: 150px;

            background-color: #ffffff;

            border-radius: 20px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .layer-item:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.08);
        }


        .layer-number {
            display: block;

            margin-bottom: 18px;

            font-size: 11px;

            color: #8a8a78;

            letter-spacing: 1px;
        }


        .layer-title {
            margin: 0;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 25px;

            font-weight: 400;
        }


        .layer-text {
            margin-top: 10px;
            margin-bottom: 0;

            font-size: 12px;

            line-height: 1.6;

            color: #777766;
        }


        /* ========================================
           모바일
        ======================================== */

        @media (max-width: 768px) {

            /* 상단 */

            .navbar-custom {
                height: auto;

                padding: 20px;
            }


            .logo {
                font-size: 22px;
            }


            .nav-menu {
                display: none;
            }


            .learn-button {
                padding: 9px 15px;

                font-size: 11px;
            }


            /* Hero */

            .hero-section {
                padding-top: 55px;
            }


            .hero-title {
                font-size: 58px;

                letter-spacing: -3px;

                line-height: 1;
            }


            .hero-subtitle {
                margin-top: 18px;

                font-size: 11px;

                letter-spacing: 1.2px;
            }


            /* 이미지 */

            .visual-section {
                margin-top: 45px;

                padding-bottom: 70px;
            }


            .hero-image {
                width: 90%;

                border-radius: 22px;
            }


            /* 아래 레이어 */

            .layer-section {
                padding: 50px 20px 80px;
            }


            .layer-container {
                grid-template-columns: 1fr 1fr;

                gap: 14px;
            }


            .layer-item {
                padding: 20px;

                min-height: 130px;

                border-radius: 16px;
            }


            .layer-title {
                font-size: 21px;
            }

        }


        /* ========================================
           작은 모바일
        ======================================== */

        @media (max-width: 480px) {

            .hero-title {
                font-size: 45px;

                letter-spacing: -2px;
            }


            .hero-subtitle {
                font-size: 10px;
            }


            .hero-image {
                width: 94%;

                border-radius: 18px;
            }


            .layer-container {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body style="--scrollbar-width: 15px; --hundred-vh: 732px;">


    <!-- ========================================
         상단 Navigation
    ========================================= -->

    <header class="navbar-custom">

        <!-- 로고 -->

        <a href="#" class="logo">
            MintoLog
        </a>


        <!-- 메뉴 -->

        <nav class="nav-menu">

            <a href="#vlog">
                Vlog
            </a>

            <a href="#story">
                Story
            </a>

            <a href="#photos">
                Photos
            </a>

            <a href="#contact">
                Contact
            </a>

        </nav>


        <!-- Learn More -->

        <a href="#vlog" class="learn-button">
            Learn More →
        </a>

    </header>



    <!-- ========================================
         Hero
    ========================================= -->

    <main>

        <section class="hero-section" id="vlog">

            <h1 class="hero-title">
                Browse everything.
            </h1>


            <p class="hero-subtitle">
                Min to Log · Daily Vlog &amp; Story
            </p>

        </section>



        <!-- ========================================
             중앙 이미지
        ========================================= -->

        <section class="visual-section">

            <img
                src="hero.jpg"
                class="hero-image"
                alt="MintoLog main image">

        </section>



        <!-- ========================================
             메뉴 아래 레이어
        ========================================= -->

        <section class="layer-section" id="story">

            <div class="layer-container">


                <!-- Vlog -->

                <div class="layer-item">

                    <span class="layer-number">
                        01 · VLOG
                    </span>

                    <h2 class="layer-title">
                        Vlog
                    </h2>

                    <p class="layer-text">
                        일상과 순간을 기록합니다.
                    </p>

                </div>


                <!-- Story -->

                <div class="layer-item">

                    <span class="layer-number">
                        02 · STORY
                    </span>

                    <h2 class="layer-title">
                        Story
                    </h2>

                    <p class="layer-text">
                        기억하고 싶은 이야기를 담습니다.
                    </p>

                </div>


                <!-- Photos -->

                <div class="layer-item" id="photos">

                    <span class="layer-number">
                        03 · PHOTOS
                    </span>

                    <h2 class="layer-title">
                        Photos
                    </h2>

                    <p class="layer-text">
                        사진으로 남겨둔 순간들입니다.
                    </p>

                </div>


                <!-- Contact -->

                <div class="layer-item" id="contact">

                    <span class="layer-number">
                        04 · CONTACT
                    </span>

                    <h2 class="layer-title">
                        Contact
                    </h2>

                    <p class="layer-text">
                        MintoLog와 이야기를 나눠보세요.
                    </p>

                </div>


            </div>

        </section>

    </main>


</body>

</html>
